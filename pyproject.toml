[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-contract-qa"
version = "0.1.0"
description = "Synthetic catalog API and independent QA contract checks"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.14,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-html>=4.1,<5",
]

[tool.setuptools.packages.find]
include = ["catalog_api*", "contracts*", "practice_runner*"]

[tool.setuptools.package-data]
contracts = ["v1/*.json", "v2/*.json", "examples/*.json"]
practice_runner = ["assets/*.py.txt", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "smoke: minimal success and error contracts",
    "regression: input, filtering and schema rejection checks",
]
